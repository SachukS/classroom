<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Особистий кабінет: факультети та дисципліни</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .faculty-card {
      color: white;
      border-radius: 12px;
      padding: 20px;
      min-height: 200px;
      background: linear-gradient(135deg, #4e54c8, #8f94fb);
      transition: transform 0.3s ease;
    }
    .faculty-card:hover {
      transform: scale(1.02);
    }
    .accordion-button {
      background-color: #f8f9fa;
    }
  </style>
</head>
<body class="bg-light">

<div class="container py-5">
  <h1 class="mb-5 text-center">Особистий кабінет: факультети та дисципліни</h1>

  <div class="row g-4 mb-4">
    <!-- Cards will be inserted here by JavaScript -->
  </div>
</div>

<script>
  const faculties = [
    {
      name: "Факультет №1",
      gradient: "linear-gradient(135deg, #4e54c8, #8f94fb)",
      specialties: [
        {
          code: "G5",
          name: "G5 Електроніка, електронні комунікації, приладобудування та радіотехніка",
          levels: {
            Бакалавр: ["Основи радіоелектроніки", "Аналогова та цифрова схемотехніка", "Технічне креслення"],
            Магістр: ["Проектування електронних систем", "Сучасні телекомунікаційні технології"],
            PhD: ["Нанотехнології в електроніці"]
          }
        }
      ]
    },
    {
      name: "Факультет №2",
      gradient: "linear-gradient(135deg, #11998e, #38ef7d)",
      specialties: [
        {
          code: "F3",
          name: "F3 Комп'ютерні науки",
          levels: {
            Бакалавр: ["Програмування мовою Java", "Бази даних", "Алгоритми та структури даних"],
            Магістр: ["Машинне навчання", "Хмарні обчислення"]
          }
        },
        {
          code: "F6",
          name: "F6 Інформаційні системи та технології",
          levels: {
            Бакалавр: ["Системний аналіз", "Веб-розробка"],
            PhD: ["Інформаційні системи в управлінні"]
          }
        }
      ]
    },
    {
      name: "Факультет №3",
      gradient: "linear-gradient(135deg, #ff416c, #ff4b2b)",
      specialties: [
        {
          code: "F5",
          name: "F5 Кібербезпека та захист інформації",
          levels: {
            Бакалавр: ["Криптографія", "Захист комп’ютерних мереж"],
            Магістр: ["Етичний хакінг", "Безпечне програмування"]
          }
        },
        {
          code: "K5",
          name: "K5 Військове управління (за видами збройних сил)",
          levels: {
            Бакалавр: ["Основи військового управління"],
            PhD: ["Оперативне планування"]
          }
        },
        {
          code: "K7",
          name: "K7 Озброєння та військова техніка",
          levels: {
            Бакалавр: ["Озброєння та техніка"],
            Магістр: ["Моделювання озброєння"]
          }
        }
      ]
    }
  ];

  const row = document.querySelector(".row");
  const courseLinks = {
  "Основи радіоелектроніки": "https://drive.google.com/your-link-1",
  "Аналогова та цифрова схемотехніка": "https://drive.google.com/your-link-2",
  "Технічне креслення": "https://drive.google.com/your-link-3",
  "Алгоритми та структури даних": "https://classroom.google.com/c/Nzc1NTQzODU4NzE2",
  // ... додайте інші курси за потребою
  };

  faculties.forEach((faculty, i) => {
    const col = document.createElement("div");
    col.className = "col-md-4";

    const card = document.createElement("div");
    card.className = "faculty-card";
    card.style.background = faculty.gradient;

    const h4 = document.createElement("h4");
    h4.textContent = faculty.name;
    card.appendChild(h4);

    const accordion = document.createElement("div");
    accordion.className = "accordion mt-3";
    accordion.id = `faculty${i+1}`;

    faculty.specialties.forEach((spec, j) => {
      const item = document.createElement("div");
      item.className = "accordion-item";

      const head = document.createElement("h2");
      head.className = "accordion-header";
      head.id = `spec${spec.code}Head`;

      const button = document.createElement("button");
      button.className = "accordion-button collapsed";
      button.type = "button";
      button.dataset.bsToggle = "collapse";
      button.dataset.bsTarget = `#spec${spec.code}`;
      button.textContent = `${spec.name}`;

      head.appendChild(button);

      const collapse = document.createElement("div");
      collapse.className = "accordion-collapse collapse";
      collapse.id = `spec${spec.code}`;
      collapse.dataset.bsParent = `#faculty${i+1}`;

      const body = document.createElement("div");
      body.className = "accordion-body";

      const ul = document.createElement("ul");
      for (let level in spec.levels) {
        const li = document.createElement("li");
        li.textContent = level;

        const innerUl = document.createElement("ul");
        spec.levels[level].forEach(course => {
          const courseLi = document.createElement("li");
          const courseLink = document.createElement("a");
          courseLink.textContent = course;
          courseLink.href = courseLinks[course] || "#";
          courseLink.target = "_blank";
          courseLink.style.textDecoration = "none";
          courseLink.style.color = "#0d6efd"; // Bootstrap primary color
          courseLi.appendChild(courseLink);
          innerUl.appendChild(courseLi);
        });

        li.appendChild(innerUl);
        ul.appendChild(li);
      }

      body.appendChild(ul);
      collapse.appendChild(body);

      item.appendChild(head);
      item.appendChild(collapse);
      accordion.appendChild(item);
    });

    card.appendChild(accordion);
    col.appendChild(card);
    row.appendChild(col);
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
